[workspace]
members = [
  "firmwares/demo-firmware",
  "firmwares/controller-firmware",
  "firmwares/msc-firmware",
  "hw-tests/wp-probe",
  "hw-tests/sd-bench",
  "hw-tests/vbus-probe",
  "hw-tests/uac-host-firmware",
  "crates/rza1l-hal",
  "crates/deluge-alloc",
  "crates/deluge-bsp",
  "firmwares/app-loader",
  "crates/deluge-sdk",
  "crates/deluge-image",
  "crates/deluge-sdk-macros",
  "crates/armv7-dsp-intrinsics",
  "crates/deluge-fixedpoint",
  "crates/deluge-fonts",
  "crates/deluge-ui-toolkit",
  "crates/deluge-grid-toolkit",
  "crates/deluge-protocol",
  "wren/deluge-wren-core",
  "examples/baremetal/blinky",
  "examples/baremetal/oled_hello",
  "examples/baremetal/oled_menu",
  "examples/baremetal/oled_hmenu",
  "examples/baremetal/input_demo",
  "examples/baremetal/pad_paint",
  "examples/baremetal/midi_cv",
  "examples/baremetal/clock_jacks",
  "examples/baremetal/sd_demo",
  "examples/baremetal/audio_passthru",
  "examples/baremetal/audio_passthru_irq",
  "examples/baremetal/test_osc",
  "examples/baremetal/additive_osc",
  "examples/baremetal/button_leds",
  "examples/baremetal/usb_log",
  "wren/wren-sys",
  "wren/wren-firmware",
]
# Crates that never build for the device: host tools and the simulator, the
# wasm web-simulator core, and the Linux backend and examples. Each builds for
# its own target from its own directory.
exclude = [
  "tools/cargo-deluge",
  "crates/deluge-simulator",
  "wren/wren-web",
  "wren/wren-web-debug",
  "wren/wren-analyzer-wasm",
  "crates/deluge-sim-link",
  "linux/deluge-sys",
  "linux/deluge-hal-linux",
  "linux/deluge-linux-ui",
  "examples/linux/rust-app",
  "examples/linux/snake",
  "examples/linux/launcher",
  "examples/linux/terminal",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Katherine Whitlock <kate@skylinesynths.nyc>"]
repository = "https://github.com/FirestormAudio/deluge-sdk"
homepage = "https://github.com/FirestormAudio/deluge-sdk"

[workspace.dependencies]
# The audio engine, from the flare repository checked out next to this one.
flare = { path = "../flare/crates/flare" }
flare-graph = { path = "../flare/crates/flare-graph" }
flare-kernels = { path = "../flare/crates/flare-kernels" }
flare-fft = { path = "../flare/crates/flare-fft" }
flare-mipgen = { path = "../flare/crates/flare-mipgen" }

# Embassy async runtime and USB stacks. Versions are set here only.
embassy-executor = "0.10.0"
embassy-futures = "0.1.2"
embassy-sync = "0.8.0"
embassy-time = "0.5.1"
embassy-time-driver = "0.2.2"
embassy-time-queue-utils = "0.3.2"
embassy-usb = "0.6.0"
embassy-usb-driver = "0.2.2"
embassy-usb-host = "0.1.0"

# Shared platform / utility crates.
cortex-ar = "0.3"
critical-section = "1"
# `info`, not `off`: features unify across the whole graph, and release is the
# only profile that fits in SRAM, so `off` would silence all logging on the
# device. `info` still drops the bulky `debug!`/`trace!` call sites.
log = { version = "0.4", features = ["release_max_level_info"] }
rtt-target = { version = "0.6", features = ["log"] }

gdbstub = { version = "0.7" }

# Fixed-point DSP math and ARMv7 DSP intrinsics, vendored from the `spark`
# project (MIT/Apache).
armv7-dsp-intrinsics = { path = "crates/armv7-dsp-intrinsics", version = "0.1.0" }
# Published as `deluge-fixedpoint`, imported as `fixedpoint`.
fixedpoint = { package = "deluge-fixedpoint", path = "crates/deluge-fixedpoint", version = "0.1.0" }

# UI crates vendored from `spark`, GPL-3.0-or-later. Apps opt into them; the
# permissively licensed `deluge` facade must not depend on them.
deluge-fonts = { path = "crates/deluge-fonts", version = "0.1.0" }
deluge-ui-toolkit = { path = "crates/deluge-ui-toolkit", version = "0.1.0" }
deluge-grid-toolkit = { path = "crates/deluge-grid-toolkit", version = "0.1.0" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
debug = true

# The FFT is worth its size at full optimisation. Profiles apply only in the
# workspace being built, so this must be set here rather than in flare.
[profile.release.package.flare-fft]
opt-level = 3

[profile.dev]
opt-level = 1
debug = true
