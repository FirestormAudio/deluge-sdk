[package]
name = "wren-firmware"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "Deluge on-device Wren scripting firmware (RZ/A1L) via Embassy"

[lib]
# The lib target exists only so the host-only `stream` module can be unit
# tested (`cargo test -p wren-firmware --lib --target x86_64-unknown-linux-gnu`);
# it is empty on the device. The firmware itself is the `[[bin]]` below.
name = "wren_firmware"
path = "src/lib.rs"

[[bin]]
name = "wren-firmware"
test = false

[dependencies]
# The firmware consumes the SDK only through the `deluge` facade (OLED, USB
# serial, …); see `tools/check-layering.sh`.
deluge-sdk = { path = "../../crates/deluge-sdk", default-features = false, features = ["usb-serial"] }
wren-sys = { path = "../wren-sys" }
# The portable Wren runtime (bindings and the `Host` trait this firmware
# implements), shared with the web simulator.
deluge-wren-core = { path = "../deluge-wren-core" }
# The DSP graph engine backing the audio task. Sized to satisfy
# deluge_wren_core's binding contract (NODES >= WREN_MAX_NODES, BUSES >= 8).
flare-graph.workspace = true
# For `flare_kernels::wav`, which the stream prefetch uses to decode WAV files.
flare-kernels.workspace = true
embassy-time = { workspace = true, features = ["tick-hz-1_000_000"] }
embassy-sync.workspace = true
embassy-futures.workspace = true
log.workspace = true

# ── Device (the Deluge, armv7a-none-eabihf) ──────────────────────────────────
# The Cortex-A executor and `embassy-usb` (for the REPL's CDC-ACM types). The
# executor features match deluge-sdk's so Cargo builds a single executor.
[target.'cfg(target_os = "none")'.dependencies]
cortex-ar.workspace = true
embassy-executor = { workspace = true, features = ["nightly", "platform-cortex-ar", "executor-thread"] }
embassy-usb.workspace = true

# ── Host (the desktop simulator, `cargo deluge sim`) ─────────────────────────
# The std executor backend; the REPL runs over stdin/stdout (no USB in the sim).
[target.'cfg(not(target_os = "none"))'.dependencies]
embassy-executor = { workspace = true, features = ["nightly", "platform-std", "executor-thread"] }

[features]
default = []
rtt = ["deluge-sdk/rtt"]
