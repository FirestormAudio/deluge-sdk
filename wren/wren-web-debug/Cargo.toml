[package]
name = "wren-web-debug"
version = "0.1.0"
edition = "2024"
publish = false
description = "Deluge Wren debugger core: runs the shared deluge foreign bindings under wren-core's Rust-compiler VM (named locals for source-level debugging)."

[lib]
crate-type = ["cdylib", "rlib"]

# The threaded-wasm entry point for `wasm32-wasip1-threads`. It links only
# against the threads sysroot, so `required-features` keeps it out of native
# and single-threaded wasm builds; build-threads.sh enables it.
[[bin]]
name = "dbg_threads"
required-features = ["threads"]

[features]
# Enables the threaded-wasm binary; no library code depends on it.
threads = []

[dependencies]
# Pinned by rev so a fresh clone builds. For local wren-rs work, point it at
# `path = "../../../wren-rs/crates/wren-core"` without committing that.
wren-core = { git = "https://github.com/FirestormAudio/wren-rs", rev = "189765a123a3a194f5982b3a4ec6bf08776fbd70", features = ["debug"] }
# Must disable default features: this crate supplies wren-core's C VM, and
# `wren-sys-backend` would link a second one.
deluge-wren-core = { path = "../deluge-wren-core", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
