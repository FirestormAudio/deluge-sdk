[package]
name = "wren-sys"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "FFI bindings + cc build of the upstream wren-lang/wren C VM (compiler + VM) for the Deluge"

[lib]
test = false

# The device VM heap uses the SDK's allocator (`deluge::deluge_alloc`). Device-only: the
# host and wasm builds route the VM through the C runtime allocator.
[target.'cfg(target_os = "none")'.dependencies]
deluge-sdk = { path = "../../crates/deluge-sdk", default-features = false }

[build-dependencies]
cc = "1"
