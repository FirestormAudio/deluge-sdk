[package]
name = "deluge-wren-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Portable Deluge Wren runtime: the foreign-binding glue, native DSP engine, and a `Host` trait that the firmware (hardware) and the web simulator (wasm) each implement. `no_std`, target-agnostic — the single source of truth for the scripting surface so the two never drift."

[lib]
test = false

[features]
default = ["wren-sys-backend"]
# The upstream C VM backend (`wren_sys::Vm` as the `SlotApi`, plus the
# `Vm`-typed entry points). Turn it off only to supply a different VM, as
# `wren-web-debug` does; linking two C VMs would duplicate symbols.
wren-sys-backend = ["dep:wren-sys"]
# `test_support`: an in-memory Host and VM-boot helper for tests. A feature
# rather than `#[cfg(test)]` so the integration tests in `tests/` can use it;
# the self dev-dependency below enables it for `cargo test`.
test-support = ["wren-sys-backend"]

[dependencies]
# The upstream Wren C VM (device, host and wasm). Optional, via
# `wren-sys-backend`, so a consumer can bring a different VM.
wren-sys = { path = "../wren-sys", optional = true }
flare-graph.workspace = true
# `no_std` float maths.
libm = "0.2"
# For `flare_kernels::wavetable::TableId`, to bind static wavetables.
flare-kernels.workspace = true
# Builds the mip pyramids `Host::upload_table` writes into a host's pool.
flare-mipgen.workspace = true

[dev-dependencies]
deluge-wren-core = { path = ".", features = ["test-support"] }
