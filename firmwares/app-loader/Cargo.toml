[package]
publish = false  # binary crate — not for crates.io
name = "app-loader"
version = "0.1.0"
edition = "2024"
license.workspace = true

[[bin]]
name = "app-loader"
test = false

[dependencies]
# The loader is an SDK app: bring-up, the display, the controls and the card come from the SDK;
# the rest (the flash app slot, launching, USB modes, protection) from the BSP and HAL.
deluge-loader = { path = "../../crates/deluge-loader" }
deluge = { path = "../../crates/deluge-sdk", package = "deluge-sdk", default-features = false, features = ["fault-blink", "unstable-parts", "usb-upload"] }
usb-classes = { workspace = true, features = ["device-msc"] }
# `unlock-bootloader`: the raw erase/program the loader writes its own boot slots with.
rza1-hal = { path = "../../rza1/rza1-hal", features = ["rza1l", "unlock-bootloader"] }
# `zero-init-below-image`: the stock first-stage bootloader runs from 0x20020000 while it
# copies this image into SRAM, so the image must start above it; the zero-init data below
# the image lifts `_start` clear. build.rs links `stock_fsb.x`, which checks it did. (The SDK's
# deluge-bsp is this one, so its bring-up gets the same layout.)
deluge-bsp = { path = "../../crates/deluge-bsp", features = ["flash", "usb-msc", "zero-init-below-image"] }
deluge-image = { path = "../../crates/deluge-image" }
cortex-ar = { workspace = true }
embassy-executor = { workspace = true, features = ["nightly", "platform-cortex-ar", "executor-thread"] }
embassy-time = { workspace = true, features = ["tick-hz-1_000_000"] }
embassy-sync = { workspace = true }
embassy-futures = { workspace = true }
embassy-usb = { workspace = true }
log = { workspace = true, features = ["release_max_level_info"] }
rtt-target = { workspace = true, optional = true }

[features]
default = []
rtt = ["dep:rtt-target", "deluge/rtt"]
## Protect the bottom-1 MB boot region: provision it when it's off, lock it down before an app,
## and (in the stock form) the SSB-update maintenance path. Off by default until the per-part
## recipe is validated on a spare unit; without it the loader never writes the protection (it
## still reloads the status registers, and confirms and updates its own slot through a volatile
## lift).
flash-protect = ["deluge-bsp/flash-protect"]
