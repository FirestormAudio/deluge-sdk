[package]
name = "deluge-fonts"
version.workspace = true
edition.workspace = true
authors = ["Firestorm Community"]
license = "GPL-3.0-or-later"
# Not published: it carries the licensed Metric font, which isn't free to redistribute.
publish = false
repository.workspace = true
readme = "README.md"
description = "Bitmap fonts for the Deluge 128x48 OLED UI toolkit (embedded-graphics)."
categories = ["embedded", "no-std", "graphics"]
keywords = ["deluge", "fonts", "oled", "embedded-graphics", "bitmap"]

[features]
default = ["embedded-graphics"]
embedded-graphics = ["dep:embedded-graphics"]

[dependencies]
embedded-graphics = { version = "0.8", optional = true }
