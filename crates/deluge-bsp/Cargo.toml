[package]
name = "deluge-bsp"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "Board support package for the Synthstrom Deluge (peripherals, PIC, OLED, SD)."
categories = ["embedded", "no-std", "hardware-support"]
keywords = ["deluge", "synthstrom", "bsp", "rza1", "embedded"]

# The peripheral code builds only for the device target.
[package.metadata.docs.rs]
default-target = "armv7a-none-eabihf"

[lib]
# Unit tests run on the host; the test harness needs std.
test = false

[features]
## The synchronous embedded-sdmmc FAT stack (the `fat` module and the
## BlockDevice/TimeSource adapters in `sd`). Opt-in, so firmware that mounts
## the card another way doesn't carry a second filesystem.
fat = ["dep:embedded-sdmmc"]
default = []
## Drive `audio::init_direct` from a per-block RX DMA interrupt instead of the
## default poll loop. Selected by `deluge/audio-irq`.
audio-irq = []
## The [`flash`] module: SPI-NOR chip profile and board memory map over
## `rza1l_hal::spibsc`. Opt-in; only the app-loader writes flash.
flash = []
## `embedded-graphics` `DrawTarget` for `oled::FrameBuffer`, so a caller can draw
## into it directly (host or device) without the async `deluge::Oled` wrapper,
## then read it back with `FrameBuffer::as_bytes`.
embedded-graphics = ["dep:embedded-graphics-core"]
## The USB host stack (`usb::host`: class drivers, UAC and MIDI). Opt-in; only
## host-role firmware needs it.
usb-host = ["dep:embassy-usb-host", "usb-classes/host-midi", "usb-classes/host-uac"]

[dependencies]
max5136 = { workspace = true }
usb-classes = { workspace = true, features = ["device-midi"] }
rza1l-hal = { path = "../rza1l-hal", version = "0.1.0" }
embedded-sdmmc = { version = "0.9", default-features = false, features = ["log"], optional = true }
critical-section = { workspace = true }
log = { workspace = true }
embedded-graphics-core = { version = "0.4", optional = true }
heapless = "0.9"
# Not device-only: the host class drivers are also unit-tested under QEMU on
# ARM Linux (see tools/test.sh).
embassy-sync = { workspace = true }
embassy-usb-driver = { workspace = true }
embassy-usb-host = { workspace = true, optional = true }

[target.'cfg(target_os = "none")'.dependencies]
usb-classes = { workspace = true, features = ["device-msc"] }
cortex-ar = { workspace = true }
embassy-futures = { workspace = true }
embassy-time = { workspace = true, features = ["tick-hz-1_000_000"] }
embassy-usb = { workspace = true }
# Task macros for `usb::host`; the firmware chooses the executor backend.
embassy-executor = { workspace = true }

[target.'cfg(not(target_os = "none"))'.dependencies]
# Polls the host panel's input for `pic::read_byte` (`host_panel`).
embassy-time = { workspace = true }

[target.'cfg(not(target_os = "none"))'.dev-dependencies]
critical-section = { workspace = true, features = ["std"] }
# Tests have no executor: `mock-driver` supplies a time driver to link against,
# and `generic-queue-8` a timer queue for the host-panel input poll.
embassy-time = { workspace = true, features = ["mock-driver", "generic-queue-8"] }
embassy-futures = { workspace = true }
proptest = "1.5"


