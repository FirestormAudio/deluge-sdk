[workspace]
# Empty table: keeps this fork out of deluge-sdk's workspace. This directory is
# its own workspace root.

[package]
name = "deluge-block-device-adapters"
version = "0.2.0"
edition = "2021"
authors = ["Scott Mabin", "Katherine Whitlock <kate@skylinesynths.nyc>"]
repository = "https://github.com/FirestormAudio/deluge-sdk"
readme = "README.md"
rust-version = "1.75"
keywords = ["block", "device", "no_std", "partition"]
categories = ["filesystem"]
license = "MIT"
description = """
Block device adapters for byte-level access and partitions: a fork of MabezDev's \
block-device-adapters with upstream fixes applied, maintained for the Deluge SDK.
"""

# Same crate name as upstream, so it is a drop-in replacement.
[lib]
name = "block_device_adapters"

[dependencies]
aligned = "0.4.2"
embedded-io-async = "0.7.0"
block-device-driver = "0.2"

log = { version = "0.4", optional = true }
defmt = { version = "0.3", optional = true }

[dev-dependencies]
env_logger = "0.9"
tokio = { version = "1", default-features = false, features = ["fs", "rt-multi-thread", "macros", "io-util"] }
anyhow = "1"
embedded-io-adapters = { version = "0.7", package = "embedded-io-adapters", features = ["tokio-1"] }

[features]
log = ["dep:log"]
defmt = ["dep:defmt"]
