[workspace]
# Empty table: keeps this fork out of deluge-sdk's workspace. This directory is
# its own workspace root.

[package]
name = "deluge-embedded-fatfs"
version = "0.2.0"
edition = "2021"
authors = ["Rafał Harabień", "Scott Mabin", "Katherine Whitlock <kate@skylinesynths.nyc>"]
repository = "https://github.com/FirestormAudio/deluge-sdk"
readme = "README.md"
rust-version = "1.75"
keywords = ["fat", "filesystem", "no_std"]
categories = ["filesystem"]
license = "MIT"
description = """
Async no_std FAT filesystem library: a fork of MabezDev's embedded-fatfs with \
upstream fixes applied, maintained for the Deluge SDK.
"""
exclude = [
    "resources/*",
]

# Same crate name as upstream, so it is a drop-in replacement.
[lib]
name = "embedded_fatfs"

[features]
# Use Rust std library
std = ["embedded-io-async/std", "dep:tokio", "dep:embedded-io-adapters"]
# LFN (Long File Name) support
lfn = []
# Use dynamic allocation. When used without std please enable core_io/collections
alloc = []
# Full Unicode support. Disabling it reduces code size by avoiding Unicode-aware character case conversion
unicode = []
# Logging through `log` or `defmt`; with both on, `defmt` is used.
log = ["dep:log"]
defmt = ["dep:defmt"]
# chrono conversions for `Date`/`DateTime`, and the local clock as the time provider (needs std)
chrono = ["dep:chrono", "std"]
# panic when dropping dirty files, files should be flushed before hand
dirty-file-panic = []

# Default features
default = ["lfn", "unicode"]

[dependencies]
# core deps
bitflags = "1.0"
embedded-io-async = "0.7.0"

# optional deps
embedded-io-adapters = { version = "0.7", package = "embedded-io-adapters", features = ["tokio-1"], optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock"], optional = true }
tokio = { version = "1", default-features = false, optional = true }
log = { version = "0.4", optional = true }
defmt = { version = "0.3", optional = true }

[dev-dependencies]
env_logger = "0.9"
embedded-fatfs = { package = "deluge-embedded-fatfs", path = ".", features = [ "std", "alloc" ] }
tokio = { version = "1", default-features = false, features = ["fs", "rt-multi-thread", "macros", "io-util"] }
anyhow = "1"
