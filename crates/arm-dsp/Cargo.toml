[package]
name = "arm-dsp"
version.workspace = true
edition.workspace = true
rust-version = "1.85"
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Safe wrappers for the 32-bit Arm DSP instructions (SMMUL, QADD, SSAT, VCVT) for fixed-point arithmetic on Cortex-A, -R and -M, with portable fallbacks."
categories = ["embedded", "no-std", "hardware-support"]
keywords = ["arm", "dsp", "fixed-point", "saturating", "cortex-m"]

[dependencies]

[dev-dependencies]
# Property tests assert every op (asm / intrinsic / fallback path) matches an
# independent wide-integer reference. Runs on host and under QEMU (see
# tools/test.sh); proptest cross-compiles to armv7-unknown-linux-gnueabihf.
proptest = "1"

[features]
default = []
# Enable unstable ARM intrinsics (requires nightly)
nightly = []

[lib]
name = "arm_dsp"
path = "src/lib.rs"
