[package]
name = "deluge-simulator"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Katherine Whitlock <kate@skylinesynths.nyc>"]
repository = "https://github.com/FirestormAudio/deluge-sdk"
readme = "README.md"
description = "Desktop front-panel simulator for the Synthstrom Deluge: renders the OLED, pads and LEDs, plays audio and bridges MIDI, for Deluge SDK apps (cargo deluge sim) or a firmware core over the deluge-panel-protocol wire."
categories = ["simulation", "gui"]
keywords = ["deluge", "simulator", "synthesizer"]

[lib]
name = "deluge_simulator"
path = "src/lib.rs"

[[bin]]
name = "deluge-simulator"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["rack", "cli"]
# The `deluge-simulator` binary (argument parsing and the logger). Libraries embedding the
# simulator, such as deluge-sdk's `sim` backend, build without it.
cli = ["dep:clap", "dep:env_logger"]
# The strip above the faceplate: CV/gate meters and L/R output scopes. Build
# without it when the simulator is linked to a remote brain over the protocol,
# which carries no audio.
rack = []

[dependencies]
# The shared host↔device wire contract (panel role).
deluge-panel-protocol = { path = "../deluge-panel-protocol", version = "0.1.0", features = ["alloc"] }
# Lock-free SPSC rings for the in-process audio bridge (cpal callback ⇄ DSP block loop).
ringbuf = "0.5"
# Host audio I/O for the in-process link.
cpal = "0.18"
# Host MIDI I/O bridge (virtual ports to/from the in-process panel).
midir = "0.11"
# Serial (USB-CDC) transport to a physical Deluge running controller-firmware,
# used as an additional control surface for the in-process brain (`--hardware`).
serialport = "4"
# WAV read/write for the --audio-in / --audio-out file bridges.
hound = "3.5"
# PNG output for headless OLED golden-frame snapshots.
png = "0.17"

# GUI and faceplate rendering.
iced = { version = "0.14", features = ["tokio", "canvas", "advanced", "image"] }
resvg = "0.47"
usvg = "0.47"
tiny-skia = "0.12"
embedded-graphics = "0.8"

# CLI
clap = { version = "4.5", features = ["derive"], optional = true }

# Logging
log = "0.4"
env_logger = { version = "0.11", optional = true }
