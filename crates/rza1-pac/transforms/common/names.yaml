transforms:
  # One module per peripheral family, named for the family rather than its first instance.
  - !Rename
    from: '^SCIF0::SCIF0$'
    to: 'SCIF::SCIF'
  - !Rename
    from: '^SCIF0::(.+)$'
    to: 'SCIF::$1'
  - !Rename
    from: '^RSPI0::RSPI0$'
    to: 'RSPI::RSPI'
  - !Rename
    from: '^RSPI0::(.+)$'
    to: 'RSPI::$1'
  - !Rename
    from: '^OSTM0::OSTM0$'
    to: 'OSTM::OSTM'
  - !Rename
    from: '^OSTM0::(.+)$'
    to: 'OSTM::$1'
  - !Rename
    from: '^SSIF0::SSIF0$'
    to: 'SSIF::SSIF'
  - !Rename
    from: '^SSIF0::(.+)$'
    to: 'SSIF::$1'
  - !Rename
    from: '^RIIC0::RIIC0$'
    to: 'RIIC::RIIC'
  - !Rename
    from: '^RIIC0::(.+)$'
    to: 'RIIC::$1'
  - !Rename
    from: '^SPIBSC0::SPIBSC0$'
    to: 'SPIBSC::SPIBSC'
  - !Rename
    from: '^SPIBSC0::(.+)$'
    to: 'SPIBSC::$1'
  - !Rename
    from: '^USB200::USB200$'
    to: 'USB::USB'
  - !Rename
    from: '^USB200::(.+)$'
    to: 'USB::$1'
  - !Rename
    from: '^DISC0::DISC0$'
    to: 'DISC::DISC'
  - !Rename
    from: '^DISC0::(.+)$'
    to: 'DISC::$1'
  - !Rename
    from: '^DVDEC1::DVDEC1$'
    to: 'DVDEC::DVDEC'
  - !Rename
    from: '^DVDEC1::(.+)$'
    to: 'DVDEC::$1'
  - !Rename
    from: '^LIN0::LIN0$'
    to: 'LIN::LIN'
  - !Rename
    from: '^LIN0::(.+)$'
    to: 'LIN::$1'
  - !Rename
    from: '^PFV0::PFV0$'
    to: 'PFV::PFV'
  - !Rename
    from: '^PFV0::(.+)$'
    to: 'PFV::$1'
  - !Rename
    from: '^RSCAN0::RSCAN0$'
    to: 'RSCAN::RSCAN'
  - !Rename
    from: '^RSCAN0::(.+)$'
    to: 'RSCAN::$1'
  - !Rename
    from: '^SCIM0::SCIM0$'
    to: 'SCIM::SCIM'
  - !Rename
    from: '^SCIM0::(.+)$'
    to: 'SCIM::$1'
  - !Rename
    from: '^SDG0::SDG0$'
    to: 'SDG::SDG'
  - !Rename
    from: '^SDG0::(.+)$'
    to: 'SDG::$1'
  - !Rename
    from: '^VDC50::VDC50$'
    to: 'VDC5::VDC5'
  - !Rename
    from: '^VDC50::(.+)$'
    to: 'VDC5::$1'
