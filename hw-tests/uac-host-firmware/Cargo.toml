[package]
publish = false
name = "uac-host-firmware"
version = "0.1.0"
edition = "2024"
license.workspace = true

[[bin]]
name = "uac-host-firmware"
test = false

[dependencies]
usb-classes = { workspace = true, features = ["host-uac"] }
rza1l-hal = { path = "../../crates/rza1l-hal" }
deluge-bsp = { path = "../../crates/deluge-bsp", features = ["usb-host"] }
rza1-alloc = { path = "../../crates/rza1-alloc" }
cortex-ar = { workspace = true }
embassy-executor = { workspace = true, features = ["nightly", "platform-cortex-ar", "executor-thread"] }
embassy-time = { workspace = true, features = ["tick-hz-1_000_000"] }
embassy-sync = { workspace = true }
embassy-futures = { workspace = true }
log = { workspace = true }
rtt-target = { workspace = true, optional = true }

[features]
# `rtt` must NOT be a default feature, even though this firmware is normally
# flashed with RTT on.  Cargo unifies features across every workspace member
# built for the same target, so a default-on `rtt` here turns on
# `deluge-bsp/rtt` in the ONE shared runtime rlib that all firmwares link.
# That compiles the runtime's RTT fault-dump assembly (crates/rza1-rt/src/
# startup.rs), which references `_SEGGER_RTT` — a symbol only a firmware's own
# `rtt_init!` defines.  Every other member defaults `rtt` off and so has no
# `rtt_init!`, making a workspace-wide `cargo build` fail to link them all with
# `undefined symbol: _SEGGER_RTT`.  Keeping this opt-in (matching every other
# member) is what makes a plain `cargo build` work.
# `cargo build-uac` passes `--features rtt` so the usual dev build is unchanged.
default = []
rtt = ["dep:rtt-target", "deluge-bsp/rtt"]
