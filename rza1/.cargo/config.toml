# The chip crates' build settings, as deluge-sdk's root .cargo/config.toml has them for these
# targets. Cargo merges this with any config in parent directories; this file is what remains
# after the Phase 6 split.
[build]
target = "armv7a-none-eabihf"

# ARM Linux under QEMU, for the host-side tests (the MMIO seam). The runner is set by
# tools/test.sh (CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_RUNNER), not here: while this directory
# sits inside deluge-sdk, Cargo concatenates this file's arrays with the parent .cargo/config.toml's,
# and a doubled runner array breaks. Add `runner` here when rza1/ becomes its own repository.
[target.armv7-unknown-linux-gnueabihf]
linker = "arm-linux-gnueabihf-gcc"
rustflags = [
  "-C", "target-cpu=cortex-a9",
  "-C", "target-feature=+neon",
]

[target.armv7a-none-eabihf]
rustflags = [
  "-C", "target-cpu=cortex-a9",
  "-C", "target-feature=+neon",
  "-C", "link-arg=--gc-sections",
  "-C", "force-frame-pointers=yes",
]
