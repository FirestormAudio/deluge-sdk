[package]
name = "rza1-rt"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Runtime for the Renesas RZ/A1 (Cortex-A9 with NEON): reset vector, exception entry and linker script."
categories = ["embedded", "no-std"]
keywords = ["rza1", "renesas", "cortex-a9", "runtime", "startup"]
# One vector table and one `_start` per image: Cargo refuses a second copy of this crate.
links = "rza1-rt"

# docs.rs builds on the x86_64 host by default; build the docs for the device.
[package.metadata.docs.rs]
default-target = "armv7a-none-eabihf"

[dependencies]
rza1-rt-macros = { version = "0.2.0", path = "../rza1-rt-macros" }

[features]
## Each fault handler first dumps the fault registers to SEGGER RTT channel 0, and the linker
## script reserves the RTT buffer (the board's memory.x must then define RTT_RAM and
## NCACHE_RTT_RAM). The image must also link `rtt-target`, which defines `_SEGGER_RTT`.
rtt = []
## The zero-init data (`.bss` and the MMU translation table) at the start of RAM, below the image,
## instead of after it. For an image that hands part of itself to the heap after boot
## (`__sram_heap_base`): the heap then runs from inside the image up, with no zero-init data in it.
zero-init-below-image = []
