[package]
name = "deluge-linux-ui"
version = "0.1.0"
edition = "2021"
# Depends on the GPL UI toolkits, which aren't published yet.
publish = false
description = "Bridge from deluge-linux's OLED framebuffer to the deluge-ui-toolkit (embedded-graphics)."

[dependencies]
libdeluge = { path = "../libdeluge" }
embedded-graphics = "0.8"
deluge-ui-toolkit = { path = "../../crates/deluge-ui-toolkit" }
deluge-grid-toolkit = { path = "../../crates/deluge-grid-toolkit" }
