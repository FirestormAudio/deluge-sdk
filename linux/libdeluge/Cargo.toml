[package]
name = "libdeluge"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Katherine Whitlock <kate@skylinesynths.nyc>"]
repository = "https://github.com/FirestormAudio/deluge-sdk"
readme = "README.md"
description = "Safe Rust interface to the Deluge's Linux userland hardware through libdeluge."
categories = ["hardware-support"]
keywords = ["deluge", "linux", "audio", "midi"]

[dependencies]
libdeluge-sys = { path = "../libdeluge-sys", version = "0.1.0" }

[package.metadata.docs.rs]
targets = ["armv7-unknown-linux-musleabihf"]
