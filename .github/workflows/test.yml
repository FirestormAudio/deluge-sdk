name: Tests

on:
  workflow_call:
  workflow_dispatch:

jobs:
  test:
    name: Unit tests (host + QEMU ARM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # deluge-sdk's workspace path-depends on a sibling ../flare checkout (the audio engine).
      # actions/checkout can't write outside the workspace, so check it out inside and link it.
      - name: Checkout flare
        uses: actions/checkout@v7
        with:
          repository: FirestormAudio/flare
          ref: ce4d6826192e9e34e2d189ddce94777d06e352c2
          path: flare
          token: ${{ secrets.FLARE_TOKEN || github.token }}
      - name: Place flare beside the checkout
        run: ln -s "$GITHUB_WORKSPACE/flare" "$GITHUB_WORKSPACE/../flare"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          # QEMU ARM bucket + host bucket (see tools/test.sh).
          # + wasm32-wasip1 for the web sim's build guard (see tools/test.sh).
          targets: armv7-unknown-linux-gnueabihf, x86_64-unknown-linux-gnu, wasm32-wasip1
          components: rust-src,llvm-tools-preview

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install QEMU + ARM cross toolchain + libudev (for serialport)
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user gcc-arm-linux-gnueabihf libudev-dev pkg-config libasound2-dev python3-yaml

      # tools/gen-pac.sh's pinned chiptool (tools/check-pac.sh installs it when missing).
      - name: Cache chiptool
        uses: actions/cache@v4
        with:
          path: rza1/target/chiptool-bcf538a2e7b8584ae874ee9ab72efb1576fc6152
          key: chiptool-bcf538a2e7b8584ae874ee9ab72efb1576fc6152

      - name: Run test suite
        run: ./tools/test.sh
