name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  examples:
    name: Examples
    uses: ./.github/workflows/examples.yml
    # Pass FLARE_TOKEN (a private flare checkout) through to the called workflow.
    secrets: inherit

  images:
    name: Images
    uses: ./.github/workflows/images.yml
    # Pass FLARE_TOKEN (a private flare checkout) through to the called workflow.
    secrets: inherit
    with:
      retention-days: 7

  tests:
    name: Tests
    uses: ./.github/workflows/test.yml
    # Pass FLARE_TOKEN (a private flare checkout) through to the called workflow.
    secrets: inherit

  rza1:
    name: rza1
    uses: ./.github/workflows/rza1.yml
